<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas | Full Stack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho da Aplicação -->
        <header class="header">
            <h1>📋 Gerenciador de Tarefas</h1>
            <p>Aplicação Full Stack com FastAPI, SQLite e Vanilla JS</p>
        </header>

        <!-- Formulário para Criar Novas Tarefas -->
        <section class="card form-section">
            <h2>Nova Tarefa</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Título *</label>
                    <input type="text" id="task-title" placeholder="Ex: Estudar FastAPI e React" required>
                </div>
                
                <div class="form-group">
                    <label for="task-desc">Descrição (opcional)</label>
                    <input type="text" id="task-desc" placeholder="Ex: Praticar rotas assíncronas e ORM">
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit">Adicionar Tarefa</button>
            </form>
        </section>

        <!-- Seção com a Lista de Tarefas -->
        <section class="card list-section">
            <div class="list-header">
                <h2>Minhas Tarefas</h2>
                <span id="task-counter" class="badge">0 tarefas</span>
            </div>
            
            <!-- Barra de Filtros -->
             <div class="filter-group">
                <button class="filter-btn active" data-filter="äll">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>

            <!-- Lista dinâmica populada pelo JavaScript -->
            <ul id="task-list" class="task-list">
                <!-- Cards de tarefas inseridos dinamicamente aqui -->
            </ul>
        </section>
    </div>

    <!-- Script de controle da aplicação -->
    <script src="app.js"></script>
</body>
</html>
